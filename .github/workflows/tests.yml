name: Development checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development check dependencies
        run: python -m pip install -e . opencv-python==5.0.0.93
      - name: Run generated-input and SDK-boundary tests
        run: python -m unittest discover -s tests -v
      - name: Build distributable
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install browser regression tools
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Check browser preview recovery
        if: runner.os == 'Linux'
        run: |
          python tests/browser_preview_recovery.py
          python tests/browser_record_comparison.py
          python tests/browser_posture_separation.py
