[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bed-pose-benchmark"
version = "0.6.0"
description = "Foundations for reproducible bed pose benchmarks"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "numpy>=1.26,<3", "av==18.1.0"]

[project.optional-dependencies]
mediapipe = ["mediapipe==0.10.35"]
live = ["mediapipe==0.10.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bed_pose = ["schemas/*.json", "templates/*.html"]
